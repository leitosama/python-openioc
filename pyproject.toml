[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-openioc"
version = "0.1.0"
description = "Full CRUD support for OpenIOC 1.0 and 1.1"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
profiles = ["jsonschema>=4.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
    "lxml-stubs>=0.5",
    "pre-commit>=3.7",
    "jsonschema>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openioc"]

[tool.hatch.build]
include = [
    "src/openioc/**/*.py",
    "src/openioc/v10/schema/*.xsd",
    "src/openioc/v11/schema/*.xsd",
    "src/openioc/profiles/schema/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line length — handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["openioc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
# warn_return_any disabled: lxml-stubs 0.5.1 lacks py.typed so mypy won't
# auto-discover them in non-isolated envs; etree.tostring() shows up as Any.
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lxml-stubs incorrectly types nsmap as Mapping[str, str] excluding None keys.
# The type: ignore on that line is unused when stubs aren't auto-discovered.
module = ["openioc.v10.writer", "openioc.v11.writer"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["openioc.profiles.*"]
warn_unused_ignores = false
