[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-openioc"
version = "0.1.0"
description = "Full CRUD support for OpenIOC 1.0 and 1.1"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/openioc"]

[tool.hatch.build]
include = [
    "src/openioc/**/*.py",
    "src/openioc/v11/schema/*.xsd",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
