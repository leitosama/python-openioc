[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openioc-profile-kedr"
version = "0.1.0"
description = "KATA KEDR consumer profile for python-openioc"
requires-python = ">=3.10"
dependencies = ["python-openioc[profiles]>=0.1"]

[project.entry-points."openioc.profiles"]
kedr = "openioc_profile_kedr:load"

[tool.hatch.build.targets.wheel]
packages = ["src/openioc_profile_kedr"]

[tool.hatch.build]
include = [
    "src/openioc_profile_kedr/**/*.py",
    "src/openioc_profile_kedr/profile.json",
]
